name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_artifact:
    name: Build App Artifact
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify app
        run: npm run verify

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: app/dist
          if-no-files-found: error
          retention-days: 7

  deploy_pages:
    name: Deploy Frontend (GitHub Pages)
    needs: build_artifact
    if: ${{ vars.ENABLE_PAGES_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  deploy_supabase_functions:
    name: Deploy Supabase Functions
    needs: build_artifact
    if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions (with smoke tests)
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_TEST_EMAIL: ${{ secrets.SUPABASE_TEST_EMAIL }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
        run: |
          $args = @('-ProjectRef', '${{ secrets.SUPABASE_PROJECT_REF }}')

          if ('${{ secrets.SUPABASE_PUBLISHABLE_KEY }}' -ne '') {
            $args += @('-PublishableKey', '${{ secrets.SUPABASE_PUBLISHABLE_KEY }}')
          }

          $hasAuthSmokeCreds = ('${{ secrets.SUPABASE_TEST_EMAIL }}' -ne '') -and ('${{ secrets.SUPABASE_TEST_PASSWORD }}' -ne '')
          if ($hasAuthSmokeCreds) {
            $args += '-RequireAuthSmoke'
          }

          & ./supabase/functions/deploy-all-functions.ps1 @args
